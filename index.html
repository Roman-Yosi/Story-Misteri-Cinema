<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Story Misteri Cinema - AI Netflix System</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* 🌫 FOG */
.fog{
position:fixed;
width:200%;
height:200%;
background:url('https://i.ibb.co/4m5qgk0/fog.png');
opacity:0.12;
animation:moveFog 30s linear infinite;
pointer-events:none;
}

@keyframes moveFog{
from{transform:translateX(0);}
to{transform:translateX(-50%);}
}

/* HEADER */
header{
text-align:center;
padding:30px;
border-bottom:1px solid #222;
}

h1{
color:red;
text-shadow:0 0 15px red;
letter-spacing:3px;
}

/* HERO PLAYER */
.player{
text-align:center;
padding:20px;
}

iframe{
width:90%;
max-width:900px;
height:450px;
border:none;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px red;
}

.card img{
width:100%;
}

.card p{
padding:10px;
font-size:13px;
color:#ccc;
}

/* SECTION */
.section-title{
padding:10px 20px;
color:red;
font-size:20px;
}

/* SOCIAL */
.social{
text-align:center;
padding:30px;
}

.btn{
display:inline-block;
margin:6px;
padding:10px 14px;
background:red;
color:white;
text-decoration:none;
border-radius:8px;
}

footer{
text-align:center;
padding:20px;
color:#666;
border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="fog"></div>

<header>
<h1>STORY MISTERI CINEMA</h1>
<p>AI Netflix Horror System</p>
</header>

<!-- 🎬 MAIN PLAYER -->
<section class="player">
<iframe id="videoPlayer"></iframe>
</section>

<!-- 🔥 AUTO LATEST (AI SYSTEM) -->
<div class="section-title">🔥 Latest Upload (Auto AI)</div>
<section class="grid" id="latestGrid"></section>

<!-- 📺 TRENDING (same system logic) -->
<div class="section-title">📺 Trending Horror Episodes</div>
<section class="grid" id="trendingGrid"></section>

<!-- 📱 SOCIAL -->
<section class="social">

<h2 style="color:red;">FOLLOW</h2>

<a class="btn" href="https://www.tiktok.com/@romanyosi">TikTok Roman Yosi</a>
<a class="btn" href="https://www.tiktok.com/@kromantv">TikTok KromanTV</a>
<a class="btn" href="https://www.instagram.com/roman.yosi">Instagram</a>
<a class="btn" href="https://www.instagram.com/kromantv1">Instagram KromanTV</a>

</section>

<footer>
© 2026 AI Netflix Horror System
</footer>

<script>

const channels = [
"UCUTSzBr1CERM8lB9OTCwrQg", // Roman Yosi
"UCMnig2Zwu_aHwu9LS_2XsgA"  // KromanTV
];

// 🔥 FETCH YOUTUBE FEED (AUTO)
async function fetchChannel(channelId){
const url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + channelId;

const res = await fetch(url);
const text = await res.text();

const parser = new DOMParser();
const xml = parser.parseFromString(text,"text/xml");

const entries = xml.querySelectorAll("entry");

let videos = [];

entries.forEach(e=>{
const title = e.querySelector("title").textContent;
const link = e.querySelector("link").getAttribute("href");
const id = link.split("v=")[1];

videos.push({title,id});
});

return videos;
}

// 🎬 LOAD GRID
async function load(){
let allVideos = [];

for(let c of channels){
const vids = await fetchChannel(c);
allVideos = allVideos.concat(vids);
}

// SORT (AI trending = newest first)
allVideos = allVideos.slice(0,6);

document.getElementById("videoPlayer").src =
"https://www.youtube.com/embed/" + allVideos[0].id + "?autoplay=1&mute=1";

// LATEST GRID
document.getElementById("latestGrid").innerHTML =
allVideos.map(v=>`
<div class="card" onclick="play('${v.id}')">
<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
<p>${v.title}</p>
</div>
`).join("");

// TRENDING GRID (duplicate logic simple AI)
document.getElementById("trendingGrid").innerHTML =
allVideos.map(v=>`
<div class="card" onclick="play('${v.id}')">
<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
<p>🔥 ${v.title}</p>
</div>
`).join("");
}

function play(id){
document.getElementById("videoPlayer").src =
"https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1";
}

load();

</script>

</body>
</html>
