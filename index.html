<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Story Misteri Cinema</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
      background: #111;
      border-bottom: 2px solid #222;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 2px;
    }

    .btn {
      display: inline-block;
      margin: 8px;
      padding: 10px 16px;
      background: red;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .section {
      padding: 30px;
    }

    iframe {
      width: 90%;
      max-width: 700px;
      height: 360px;
      border-radius: 12px;
      border: none;
    }

    select {
      padding: 10px;
      border-radius: 8px;
      margin: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>STORY MISTERI CINEMA</h1>
  <p>Cinematic Horror & Mystery Stories</p>

  <a class="btn" href="https://youtube.com/@romanyosi" target="_blank">Roman Yosi</a>
  <a class="btn" href="https://youtube.com/@kromantv" target="_blank">KromanTV</a>
</header>

<div class="section">

  <h2>Latest Video</h2>

  <!-- PILIH CHANNEL -->
  <select id="channelSelect" onchange="loadVideo()">
    <option value="UCUTSzBr1CERM8lB9OTCwrQg">Roman Yosi</option>
    <option value="UCMnig2Zwu_aHwu9LS_2XsgA">KromanTV</option>
  </select>

  <br>

  <iframe id="videoFrame"
    src="https://www.youtube.com/embed?listType=user_uploads&list=UCUTSzBr1CERM8lB9OTCwrQg"
    allowfullscreen>
  </iframe>

</div>

<div class="section">
  <h2>About</h2>
  <p>
    Story Misteri Cinema adalah channel cinematic horror & mystery storytelling.
  </p>
</div>

<footer style="padding:20px; color:#777;">
  © 2026 Story Misteri Cinema
</footer>

<script>
function loadVideo() {
  let channelId = document.getElementById("channelSelect").value;
  let frame = document.getElementById("videoFrame");

  frame.src = "https://www.youtube.com/embed?listType=user_uploads&list=" + channelId;
}
</script>

</body>
</html>
