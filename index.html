<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Story Misteri Cinema - Horror Streaming</title>

<meta name="description" content="Streaming cerita horor cinematic Indonesia">
<meta name="keywords" content="horor, misteri, roman yosi, story cinema">

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* 🌫 FOG */
.fog{
position:fixed;
width:200%;
height:200%;
background:url('https://i.ibb.co/4m5qgk0/fog.png');
opacity:0.12;
animation:moveFog 30s linear infinite;
pointer-events:none;
}

@keyframes moveFog{
from{transform:translateX(0);}
to{transform:translateX(-50%);}
}

/* HEADER */
header{
text-align:center;
padding:20px;
border-bottom:1px solid #222;
}

h1{
color:red;
text-shadow:0 0 15px red;
}

/* PLAYER */
.player{
text-align:center;
padding:20px;
}

iframe{
width:90%;
max-width:900px;
height:450px;
border:none;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px red;
}

.card img{width:100%;}
.card p{padding:10px;font-size:13px;color:#ccc;}

/* ADS */
.ads{
margin:20px;
padding:20px;
border:1px dashed #444;
text-align:center;
color:#888;
background:#111;
}

/* HISTORY */
.history{
padding:20px;
color:#aaa;
font-size:13px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
color:#666;
border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="fog"></div>

<header>
<h1>STORY MISTERI CINEMA</h1>
</header>

<!-- 🎬 PLAYER -->
<section class="player">
<iframe id="videoPlayer"></iframe>
<h3 id="title">Loading...</h3>
<p id="desc">Memuat video...</p>
</section>

<!-- 💰 ADS -->
<div class="ads">
📢 Ad Slot (AdSense / Adsterra Ready)
</div>

<!-- 🔥 GRID -->
<div class="grid" id="grid"></div>

<!-- 📺 HISTORY -->
<div class="history">
<h3>Watch History</h3>
<ul id="history"></ul>
</div>

<footer>
© 2026 Story Misteri Cinema
</footer>

<script>

const channelId = "UCUTSzBr1CERM8lB9OTCwrQg";

// 🔥 FIXED FETCH YOUTUBE FEED
async function loadVideos(){
try{
const url = "https://www.youtube.com/feeds/videos.xml?channel_id="+channelId;
const res = await fetch(url);
const text = await res.text();

const parser = new DOMParser();
const xml = parser.parseFromString(text,"text/xml");

const entries = xml.querySelectorAll("entry");

let vids=[];

entries.forEach(e=>{
let title = e.querySelector("title").textContent;
let link = e.querySelector("link").getAttribute("href");

let idMatch = link.match(/v=([^&]+)/);
let id = idMatch ? idMatch[1] : "";

if(id){
vids.push({title,id});
}
});

// fallback kalau kosong
if(vids.length === 0){
document.getElementById("title").innerText = "Video tidak ditemukan";
return;
}

render(vids);

// auto play first video
play(vids[0].id, vids[0].title);

}catch(err){
document.getElementById("title").innerText = "Error loading video feed";
}
}

// 🎬 RENDER GRID
function render(videos){
document.getElementById("grid").innerHTML =
videos.slice(0,6).map(v=>`
<div class="card" onclick="play('${v.id}','${v.title}')">
<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
<p>${v.title}</p>
</div>
`).join("");
}

// 🎥 PLAY VIDEO
function play(id,title){

document.getElementById("videoPlayer").src =
"https://www.youtube.com/embed/"+id+"?autoplay=1&mute=1";

document.getElementById("title").innerText = title;

document.getElementById("desc").innerText =
"Episode horor cinematic: " + title;

saveHistory(title);
}

// 📜 HISTORY
function saveHistory(title){
let h = JSON.parse(localStorage.getItem("history")||"[]");
h.unshift(title);
localStorage.setItem("history",JSON.stringify(h));

document.getElementById("history").innerHTML =
h.slice(0,5).map(x=>"<li>"+x+"</li>").join("");
}

// LOAD HISTORY
(function(){
let h = JSON.parse(localStorage.getItem("history")||"[]");
document.getElementById("history").innerHTML =
h.slice(0,5).map(x=>"<li>"+x+"</li>").join("");
})();

loadVideos();

</script>

</body>
</html>
