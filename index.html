<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Story Misteri Cinema</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow-x: hidden;
}

/* 🔥 GLITCH INTRO */
.intro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  animation: fadeOut 3s forwards 3s;
  z-index: 999;
}

.glitch {
  font-size: 40px;
  font-weight: bold;
  color: red;
  position: relative;
  animation: glitch 1s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px,2px); }
  40% { transform: translate(2px,-2px); }
  60% { transform: translate(-1px,1px); }
  80% { transform: translate(1px,-1px); }
  100% { transform: translate(0); }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* HEADER */
header {
  padding: 30px;
  text-align: center;
  background: linear-gradient(#111,#000);
  border-bottom: 1px solid #222;
}

h1 {
  letter-spacing: 3px;
}

/* BUTTON */
.btn {
  background: red;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 8px;
  color: white;
  text-decoration: none;
}

/* HERO */
.hero img {
  width: 100%;
  max-width: 900px;
  border-radius: 15px;
  margin-top: 20px;
}

/* LAYOUT */
.section {
  padding: 30px;
}

/* VIDEO */
iframe {
  width: 90%;
  max-width: 800px;
  height: 420px;
  border-radius: 12px;
  border: none;
}

/* EPISODE LIST (Netflix Style) */
.episodes {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px;
}

.ep {
  min-width: 200px;
  background: #111;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.ep:hover {
  background: red;
}

/* ADS PLACEHOLDER */
.ad-box {
  margin: 20px auto;
  padding: 20px;
  background: #111;
  border: 1px dashed #444;
  max-width: 800px;
}
</style>
</head>

<body>

<!-- 🔥 GLITCH INTRO -->
<div class="intro">
  <div class="glitch">STORY MISTERI CINEMA</div>
  <p>Cinematic Horror Experience</p>
</div>

<header>
  <h1>STORY MISTERI CINEMA</h1>

  <a class="btn" href="https://youtube.com/@romanyosi">Roman Yosi</a>
  <a class="btn" href="https://youtube.com/@kromantv">KromanTV</a>
</header>

<!-- POSTER -->
<div class="section hero">
  <img src="https://github.com/Roman-Yosi/Poto-mister-cinema/blob/main/Cinemamisteri.png?raw=true">
</div>

<!-- VIDEO PLAYER -->
<div class="section">

  <h2>Latest Episode</h2>

  <iframe id="video"
    src="https://www.youtube.com/embed?listType=user_uploads&list=UCUTSzBr1CERM8lB9OTCwrQg">
  </iframe>

</div>

<!-- EPISODE LIST -->
<div class="section">
  <h2>Episodes</h2>

  <div class="episodes">

    <div class="ep" onclick="loadVideo('UCUTSzBr1CERM8lB9OTCwrQg')">
      🎬 Roman Yosi
    </div>

    <div class="ep" onclick="loadVideo('UCMnig2Zwu_aHwu9LS_2XsgA')">
      🎬 KromanTV
    </div>

  </div>
</div>

<!-- ADS READY BOX -->
<div class="ad-box">
  📢 Ad Slot (AdSense / Adsterra Ready Area)
</div>

<!-- ABOUT -->
<div class="section">
  <h2>About</h2>
  <p>
    Story Misteri Cinema adalah channel cinematic horror & mystery storytelling.
  </p>
</div>

<footer class="section">
  © 2026 Story Misteri Cinema
</footer>

<script>
function loadVideo(id){
  document.getElementById("video").src =
  "https://www.youtube.com/embed?listType=user_uploads&list=" + id;
}
</script>

</body>
</html>
