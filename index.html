<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Story Misteri Cinema</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* 🌫 FOG */
.fog {
  position: fixed;
  width: 200%;
  height: 200%;
  background: url('https://i.ibb.co/4m5qgk0/fog.png');
  opacity: 0.12;
  animation: moveFog 30s linear infinite;
  pointer-events: none;
}

@keyframes moveFog {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* HEADER */
header {
  padding: 40px;
  text-align: center;
  background: linear-gradient(#111,#000);
  border-bottom: 1px solid #222;
}

h1 {
  font-size: 36px;
  letter-spacing: 3px;
  text-shadow: 0 0 10px red;
}

p {
  color: #aaa;
}

.btn {
  display: inline-block;
  margin: 6px;
  padding: 10px 14px;
  background: red;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  transition: 0.3s;
}

.btn:hover {
  background: darkred;
  transform: scale(1.05);
}

/* HERO */
.hero img {
  width: 100%;
  max-width: 900px;
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(255,0,0,0.2);
}

/* VIDEO */
.video {
  text-align: center;
  padding: 20px;
}

iframe {
  width: 90%;
  max-width: 800px;
  height: 420px;
  border-radius: 12px;
  border: none;
}

/* INFO */
.info {
  max-width: 800px;
  margin: auto;
  padding: 20px;
  text-align: left;
  color: #ccc;
}

.info h2 {
  color: red;
}

/* SOCIAL */
.social {
  text-align: center;
  padding: 30px;
}

.social h2 {
  color: red;
  letter-spacing: 2px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  border-top: 1px solid #222;
}
</style>
</head>

<body>

<div class="fog"></div>

<header>
  <h1>STORY MISTERI CINEMA</h1>
  <p>Cinematic Horror Universe</p>
</header>

<section class="hero">
  <img src="https://github.com/Roman-Yosi/Poto-mister-cinema/blob/main/Cinemamisteri.png?raw=true">
</section>

<!-- 🎬 VIDEO -->
<section class="video">
  <h2>Latest Video</h2>
  <iframe id="videoPlayer" allowfullscreen></iframe>
</section>

<!-- 📄 TITLE + DESCRIPTION -->
<section class="info">
  <h2 id="videoTitle">Loading...</h2>
  <p id="videoDesc">Memuat deskripsi video...</p>
</section>

<!-- 📱 SOCIAL MEDIA -->
<section class="social">

  <h2>FOLLOW OUR SOCIAL MEDIA</h2>
  <p style="color:#aaa;">Stay connected with Story Misteri Cinema</p>

  <a class="btn" href="https://www.tiktok.com/@romanyosi" target="_blank">TikTok Roman Yosi</a>
  <a class="btn" href="https://www.tiktok.com/@kromantv" target="_blank">TikTok KromanTV</a>
  <a class="btn" href="https://www.instagram.com/kromantv1" target="_blank">Instagram KromanTV</a>
  <a class="btn" href="https://www.instagram.com/roman.yosi" target="_blank">Instagram Roman Yosi</a>

</section>

<footer>
  © 2026 Story Misteri Cinema
</footer>

<!-- 🚀 AUTO YOUTUBE + TITLE + DESCRIPTION -->
<script>
async function loadLatest(channelId){
  const uploads = "UU" + channelId.substring(2);

  document.getElementById("videoPlayer").src =
    "https://www.youtube.com/embed/videoseries?list=" +
    uploads + "&autoplay=1&mute=1";

  fetch("https://www.youtube.com/feeds/videos.xml?channel_id=" + channelId)
  .then(res => res.text())
  .then(str => {
    const parser = new DOMParser();
    const xml = parser.parseFromString(str, "text/xml");

    const title = xml.querySelector("entry > title")?.textContent;
    const desc = xml.querySelector("entry > media\\:description")?.textContent;

    document.getElementById("videoTitle").innerText = title || "No Title";
    document.getElementById("videoDesc").innerText = desc || "No Description";
  });
}

// 🎬 default channel Roman Yosi
loadLatest("UCUTSzBr1CERM8lB9OTCwrQg");
</script>

</body>
</html>
